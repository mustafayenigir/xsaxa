<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitap</title>
<style>
  :root {
    --ana: #0b6b3a; --ana2: #138a57; --vurgu: #00A86B;
    --sari: #fff1a8; --yesil: #c9efc9; --mavi: #c4e1ff;
    --zemin: #f3f7f3; --kart: #ffffff; --yazi: #1d2a22; --soluk: #66756b; --cizgi: #d6e2d8; --yumusak: #eef4ef;
  }
  html.dark {
    --ana: #4fc78a; --ana2: #66d39b; --vurgu: #3ccf8e;
    --sari: #5a5217; --yesil: #1f4a2c; --mavi: #1f3d5c;
    --zemin: #0f1712; --kart: #17221b; --yazi: #e6efe8; --soluk: #9db3a4; --cizgi: #2a3a30; --yumusak: #1d2b22;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--zemin); color: var(--yazi);
    font-family: 'Segoe UI', Roboto, 'Noto Sans', sans-serif; }
  body { padding: 12px 12px 90px; user-select: none; -webkit-user-select: none; }
  button { font-family: inherit; }
  .gorunum { display: none; }
  .baslik { font-size: 22px; font-weight: 700; color: var(--ana); margin: 4px 0 2px; text-align: center; }
  .alt { color: var(--soluk); font-size: 14px; margin: 0 0 14px; text-align: center; }

  /* Sure listesi */
  .ara-kutu { display: flex; gap: 8px; margin: 0 0 12px; }
  .ara-girdi { flex: 1; min-width: 0; border: 1px solid var(--cizgi); border-radius: 10px; padding: 12px 13px; font-size: 16px;
    color: var(--yazi); background: var(--kart); user-select: text; -webkit-user-select: text; font-family: inherit; }
  .ara-girdi:focus { outline: 2px solid var(--vurgu); border-color: var(--vurgu); }
  .btn { background: var(--ana); color: #fff; border: none; border-radius: 10px; padding: 0 18px; font-size: 15px; font-weight: 700; }
  html.dark .btn { color: #08130c; }
  .devam { width: 100%; text-align: left; background: linear-gradient(135deg, #0b5d3b, #138a57); color: #fff; border: none;
    border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 15px; font-weight: 700; }
  .devam small { display: block; font-weight: 400; opacity: .85; margin-top: 2px; }
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .sure-btn { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 10px; padding: 12px 14px; font-size: 16px;
    font-weight: 600; color: var(--yazi); text-align: left; display: flex; align-items: center; gap: 12px; width: 100%; }
  .sure-btn:active { background: var(--yumusak); }
  .sira { min-width: 32px; height: 32px; border-radius: 16px; background: var(--yumusak); color: var(--ana); font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; }
  .sure-not { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--soluk); }

  /* Okuyucu */
  .ust { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .geri { background: var(--vurgu); color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; }
  .gez { background: var(--yumusak); color: var(--yazi); border: none; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-weight: 700; }
  .gez:disabled { opacity: .35; }
  #ok-baslik { flex: 1; text-align: center; font-size: 18px; font-weight: 700; color: var(--ana); line-height: 1.3; }
  #ok-kaynak { display: block; font-size: 11px; font-weight: 400; color: var(--soluk); }
  .ipucu { font-size: 12.5px; color: var(--soluk); margin: 0 2px 10px; }
  #durum { text-align: center; color: var(--soluk); padding: 26px 10px; font-size: 15px; }
  #durum.hata { color: #c0392b; }
  #ayetler { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 12px; padding: 10px 6px; }
  .ayet { padding: 6px 10px; border-radius: 8px; font-size: 18px; line-height: 1.75; border-left: 4px solid transparent; word-break: break-word; }
  .ayet.v1 { background: var(--sari); } .ayet.v2 { background: var(--yesil); } .ayet.v3 { background: var(--mavi); }
  .ayet.sec { box-shadow: inset 4px 0 0 var(--ana); outline: 2px dashed var(--ana2); outline-offset: -2px; }
  .ayet.hedef { outline: 2px solid #f0b400; outline-offset: -2px; }
  .no { font-size: 12px; font-weight: 700; color: var(--ana); margin-right: 6px; vertical-align: super; }
  .not-ikon { display: inline-flex; vertical-align: middle; margin-left: 6px; background: var(--ana); color: #fff; border: none; border-radius: 50%;
    width: 26px; height: 26px; align-items: center; justify-content: center; padding: 0; }
  .not-ikon svg, .bl svg { width: 16px; height: 16px; fill: currentColor; }
  mark.isaret { background: #ffeb3b; color: #000; border-radius: 2px; padding: 0 1px; }
  .not-kutu { margin: 2px 8px 10px 22px; background: var(--yumusak); border: 1px solid var(--cizgi); border-left: 4px solid var(--ana2);
    border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  .not-tarih { font-size: 12px; color: var(--soluk); margin-bottom: 4px; }
  .not-metin-goster { white-space: pre-wrap; word-break: break-word; line-height: 1.5; user-select: text; -webkit-user-select: text; }
  .dugmeler { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .mini { border: 1px solid var(--cizgi); background: var(--kart); color: var(--yazi); border-radius: 8px; padding: 7px 13px; font-size: 14px; font-weight: 600; }
  .mini.tehlike { color: #c0392b; border-color: #e0a8a0; }
  .mini.ana { background: var(--ana); border-color: var(--ana); color: #fff; }
  html.dark .mini.ana { color: #08130c; }
  .mini:disabled { opacity: .5; }
  textarea.not-metin { width: 100%; min-height: 90px; resize: vertical; border: 1px solid var(--cizgi); border-radius: 8px; padding: 9px 11px;
    font-size: 16px; line-height: 1.45; font-family: inherit; color: var(--yazi); background: var(--kart); user-select: text; -webkit-user-select: text; }
  .sayac { margin-left: auto; font-size: 12px; color: var(--soluk); }
  .not-durum { font-size: 13px; color: var(--ana); min-height: 16px; margin-top: 4px; }
  .not-durum.hata { color: #c0392b; }
  .coklu-baslik { font-weight: 700; color: var(--ana); margin-bottom: 4px; }
  .coklu-uyari { font-size: 13px; color: #a9601f; margin-bottom: 6px; }

  /* Baloncuk */
  #baloncuk { display: none; position: fixed; z-index: 100; background: var(--kart); border: 1px solid var(--cizgi); border-radius: 32px;
    padding: 6px 8px; box-shadow: 0 6px 22px rgba(0,0,0,.25); gap: 6px; align-items: center; }
  #baloncuk.acik { display: flex; }
  .bl { width: 40px; height: 40px; border-radius: 50%; border: 2px solid transparent; padding: 0; display: inline-flex; align-items: center;
    justify-content: center; background: var(--yumusak); color: var(--yazi); }
  .bl.r1 { background: #fff1a8; border-color: #e5c84a; } .bl.r2 { background: #c9efc9; border-color: #7cc67c; } .bl.r3 { background: #c4e1ff; border-color: #6aa9e6; }
  .bl.secili { border-color: #222; box-shadow: 0 0 0 2px #fff inset; }
  .bl-ayrac { width: 1px; height: 24px; background: var(--cizgi); }
  .bl-sayi { font-size: 13px; font-weight: 700; padding: 0 4px; white-space: nowrap; color: var(--ana); }
  #bildirim { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 101; background: #222; color: #fff;
    padding: 10px 18px; border-radius: 20px; font-size: 14px; display: none; max-width: 90%; text-align: center; }
  #bildirim.acik { display: block; }
  #ara-sonuc { display: none; align-items: center; gap: 8px; flex-wrap: wrap; margin: -4px 2px 10px; font-size: 14px; color: var(--soluk); }
  #ara-sonuc.acik { display: flex; }
  #yukari { position: fixed; right: 14px; bottom: 22px; z-index: 90; width: 46px; height: 46px; border-radius: 50%; border: none;
    background: var(--ana); color: #fff; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  #yukari.acik { display: flex; }
  #yukari::before { content: ""; width: 12px; height: 12px; border-left: 3px solid currentColor; border-top: 3px solid currentColor; transform: rotate(45deg); margin-top: 5px; }
</style>
</head>
<body>

<!-- 1. SURELER -->
<div id="g-liste" class="gorunum">
  <div class="baslik">Kur'an-ı Kerim Meali</div>
  <p class="alt">Diyanet İşleri Meali (Yeni) · 114 sure</p>
  <div id="devam-kap"></div>
  <div class="ara-kutu">
    <input id="sure-ara" class="ara-girdi" type="text" maxlength="40" autocomplete="off" placeholder="Sure ara (ör. 36 veya Yâsîn)">
  </div>
  <div id="liste" class="liste"></div>
</div>

<!-- 2. OKUYUCU -->
<div id="g-okuyucu" class="gorunum">
  <div class="ust">
    <button type="button" class="geri" id="btn-sureler">‹ Sureler</button>
    <button type="button" class="gez" id="btn-onceki">‹</button>
    <div id="ok-baslik"><span id="ok-ad"></span><span id="ok-kaynak">Diyanet İşleri Meali (Yeni)</span></div>
    <button type="button" class="gez" id="btn-sonraki">›</button>
  </div>
  <div class="ara-kutu" id="bolum-ara-kutu" style="display:none;">
    <input id="bolum-ara" class="ara-girdi" type="text" maxlength="60" autocomplete="off" placeholder="Bu surede ara...">
    <button type="button" class="btn" id="bolum-ara-btn">Ara</button>
  </div>
  <div id="ara-sonuc">
    <span id="ara-sayi"></span>
    <button type="button" class="mini" id="ara-onceki">Önceki</button>
    <button type="button" class="mini" id="ara-sonraki">Sonraki</button>
    <button type="button" class="mini" id="ara-temizle">Temizle</button>
  </div>
  <div class="ipucu" id="ipucu" style="display:none;">Ayete dokunun: kopyalayabilir, renkle vurgulayabilir ya da not alabilirsiniz. Birden çok ayete sırayla dokunarak hepsini birlikte seçebilirsiniz.</div>
  <div id="durum">Yükleniyor...</div>
  <div id="ayetler" style="display:none;"></div>
</div>

<div id="baloncuk" role="toolbar" aria-label="Ayet işlemleri"></div>
<div id="bildirim" role="status"></div>
<button type="button" id="yukari" aria-label="Yukarı çık"></button>

<script>
(function () {
  'use strict';
  var SURELER = ["Fâtiha", "Bakara", "Âl-i İmrân", "Nisâ", "Mâide", "En'âm", "A'râf", "Enfâl", "Tevbe", "Yûnus", "Hûd", "Yûsuf", "Ra'd", "İbrâhîm", "Hicr", "Nahl", "İsrâ", "Kehf", "Meryem", "Tâhâ", "Enbiyâ", "Hac", "Mü'minûn", "Nûr", "Furkân", "Şuarâ", "Neml", "Kasas", "Ankebût", "Rûm", "Lokmân", "Secde", "Ahzâb", "Sebe'", "Fâtır", "Yâsîn", "Sâffât", "Sâd", "Zümer", "Mü'min", "Fussilet", "Şûrâ", "Zuhruf", "Duhân", "Câsiye", "Ahkâf", "Muhammed", "Fetih", "Hucurât", "Kâf", "Zâriyât", "Tûr", "Necm", "Kamer", "Rahmân", "Vâkıa", "Hadîd", "Mücâdele", "Haşr", "Mümtehine", "Saff", "Cuma", "Münâfikûn", "Teğâbün", "Talâk", "Tahrîm", "Mülk", "Kalem", "Hâkka", "Meâric", "Nûh", "Cin", "Müzzemmil", "Müddessir", "Kıyâme", "İnsan", "Mürselât", "Nebe'", "Nâziât", "Abese", "Tekvîr", "İnfitâr", "Mutaffifîn", "İnşikâk", "Bürûc", "Târık", "A'lâ", "Gâşiye", "Fecr", "Beled", "Şems", "Leyl", "Duhâ", "İnşirâh", "Tîn", "Alak", "Kadir", "Beyyine", "Zilzâl", "Âdiyât", "Kâria", "Tekâsür", "Asr", "Hümeze", "Fîl", "Kureyş", "Mâûn", "Kevser", "Kâfirûn", "Nasr", "Tebbet", "İhlâs", "Felak", "Nâs"];
  var AYET_SAYISI = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
  var KAYNAK = 'Diyanet İşleri Meali (Yeni)';
  var NOT_MAX = 1000;
  var BOSTA_SN = 180, GONDER_SN = 60;
  var RENKLER = [{ kod: 1, ad: 'Sarı' }, { kod: 2, ad: 'Yeşil' }, { kod: 3, ad: 'Mavi' }];
  var YOL = {
    kopya: 'M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z',
    not: 'M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z',
    kapat: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'
  };

  // ---------------------------------------------------------------- Android köprüsü
  var bekleyen = {}, istekNo = 0;
  window.__kitapCevap = function (id, metin) {
    var f = bekleyen[id];
    delete bekleyen[id];
    if (!f) return;
    var d = null;
    try { d = metin ? JSON.parse(metin) : null; } catch (e) { d = null; }
    if (d) f.coz(d); else f.red(new Error('bağlantı'));
  };
  function sunucu(o) {
    return new Promise(function (coz, red) {
      var id = 'q' + (++istekNo);
      bekleyen[id] = { coz: coz, red: red };
      try { Android.call(id, JSON.stringify(o)); } catch (e) { delete bekleyen[id]; red(e); }
    });
  }
  function yerelAl(k) { try { return Android.getPref(k) || ''; } catch (e) { return ''; } }
  function yerelYaz(k, v) { try { Android.setPref(k, String(v)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function el(tag, sinif, metin) {
    var e = document.createElement(tag);
    if (sinif) e.className = sinif;
    if (metin !== undefined && metin !== null) e.textContent = metin;
    return e;
  }
  function svg(ad) {
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg'); s.setAttribute('viewBox', '0 0 24 24');
    var p = document.createElementNS(ns, 'path'); p.setAttribute('d', YOL[ad]); s.appendChild(p);
    return s;
  }
  function bildir(m) {
    var b = $('bildirim'); b.textContent = m; b.className = 'acik';
    clearTimeout(bildir.z); bildir.z = setTimeout(function () { b.className = ''; }, 1900);
  }
  function goster(ad) {
    $('g-liste').style.display = ad === 'liste' ? 'block' : 'none';
    $('g-okuyucu').style.display = ad === 'okuyucu' ? 'block' : 'none';
  }

  // Türkçe harf / büyük-küçük farkını siler (uzunluk korunur)
  var KATLA = { "ç": "c", "Ç": "c", "ğ": "g", "Ğ": "g", "ı": "i", "İ": "i", "I": "i", "ö": "o", "Ö": "o", "ş": "s", "Ş": "s", "ü": "u", "Ü": "u",
    "â": "a", "Â": "a", "î": "i", "Î": "i", "û": "u", "Û": "u", "’": "'", "‘": "'", "`": "'" };
  function katla(s) {
    var t = String(s == null ? '' : s), o = '';
    for (var i = 0; i < t.length; i++) { var c = t.charAt(i), m = KATLA[c]; if (m) { o += m; continue; } var l = c.toLowerCase(); o += (l.length === 1 ? l : c); }
    return o;
  }
  function sade(s) { return katla(s).replace(/[^a-z0-9]/g, ''); }

  // ---------------------------------------------------------------- 1) sure listesi
  function listeyiCiz() {
    var kap = $('liste'); kap.textContent = '';
    SURELER.forEach(function (ad, i) {
      var b = el('button', 'sure-btn'); b.type = 'button';
      b.setAttribute('data-no', String(i + 1));
      b.setAttribute('data-ad', sade(ad));
      b.appendChild(el('span', 'sira', String(i + 1)));
      b.appendChild(el('span', null, ad));
      b.appendChild(el('span', 'sure-not', AYET_SAYISI[i] + ' ayet'));
      b.addEventListener('click', function () { sureAc(i + 1); });
      kap.appendChild(b);
    });
    devamCiz();
  }
  function devamCiz() {
    var kap = $('devam-kap'); kap.textContent = '';
    var son = parseInt(yerelAl('son_sure'), 10);
    if (son >= 1 && son <= 114) {
      var b = el('button', 'devam'); b.type = 'button';
      b.appendChild(document.createTextNode('📖 Kaldığınız yerden devam edin: ' + son + '. ' + SURELER[son - 1]));
      var ay = parseInt(yerelAl('son_ayet'), 10);
      if (ay > 1) b.appendChild(el('small', null, ay + '. ayet'));
      b.addEventListener('click', function () { sureAc(son, ay > 1 ? ay : 0); });
      kap.appendChild(b);
    }
  }
  $('sure-ara').addEventListener('input', function () {
    var q = this.value.trim(), f = sade(q), sayi = /^[0-9]{1,3}$/.test(q) ? q : '';
    var l = $('liste').children;
    for (var i = 0; i < l.length; i++) {
      var d = l[i], no = d.getAttribute('data-no');
      var uygun = !f || (sayi ? no.indexOf(sayi) === 0 : d.getAttribute('data-ad').indexOf(f) !== -1);
      d.style.display = uygun ? '' : 'none';
    }
  });
  $('sure-ara').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var gor = [].filter.call($('liste').children, function (d) { return d.style.display !== 'none'; });
    if (gor.length === 1) gor[0].click();
    this.blur();
  });

  // ---------------------------------------------------------------- 2) sureyi aç
  var aktif = 0, ayetMetinleri = [], kayitlar = {}, acmaNo = 0, kayitDegisti = false;
  var kuyruk = Promise.resolve();
  function sirayaAl(is) { kuyruk = kuyruk.then(is).catch(function () {}); return kuyruk; }

  function sureAc(no, hedefAyet) {
    izlemeBitir();
    baloncukKapat();
    var benim = ++acmaNo;
    aktif = no; ayetMetinleri = []; kayitlar = {}; kayitDegisti = false;
    secimiBosalt(); cokluNotuKapat();
    aramaTerimleri = null; eslesmeler = []; eslesmeNo = -1; $('bolum-ara').value = ''; araSayac();
    $('ok-ad').textContent = no + '. ' + SURELER[no - 1] + ' Suresi';
    $('ok-kaynak').textContent = KAYNAK;
    $('btn-onceki').disabled = no <= 1;
    $('btn-sonraki').disabled = no >= 114;
    $('ayetler').style.display = 'none'; $('ayetler').textContent = '';
    $('bolum-ara-kutu').style.display = 'none'; $('ipucu').style.display = 'none';
    durumYaz('Sure yükleniyor...', false);
    goster('okuyucu');
    window.scrollTo(0, 0);
    yerelYaz('son_sure', no);
    if (!hedefAyet) yerelYaz('son_ayet', 1);
    sunucu({ action: 'kuran', sure: no }).then(function (d) {
      if (benim !== acmaNo) return;
      if (!d || !d.ok) throw new Error(d && d.error === 'auth' ? 'oturum' : (d && d.error === 'restricted' ? 'kapali' : 'sunucu'));
      ayetMetinleri = (d.ayetler || []).map(function (a) { return [parseInt(a[0], 10), String(a[1])]; });
      if (!ayetMetinleri.length) { durumYaz('Bu surenin metni Excel\'deki "Kuran" sayfasında bulunamadı.', true); return; }
      kayitlariAl(d.kayitlar);
      $('durum').style.display = 'none';
      ayetleriCiz();
      $('ayetler').style.display = 'block';
      $('bolum-ara-kutu').style.display = 'flex';
      $('ipucu').style.display = '';
      izlemeBaslat(no);
      if (hedefAyet > 0) { var s = satir(hedefAyet); if (s) s.scrollIntoView({ block: 'start' }); }
    }).catch(function (err) {
      if (benim !== acmaNo) return;
      if (err.message === 'kapali') { durumYaz('Bu bölüm şu an kullanımınıza kapalı.', true); return; }
      durumYaz(err.message === 'oturum' ? 'Oturum doğrulanamadı. Uygulamayı kilitleyip yeniden giriş yapın.'
        : 'Sure yüklenemedi. İnternet bağlantınızı kontrol edip tekrar deneyin.', true, function () { sureAc(no, hedefAyet); });
    });
  }
  function durumYaz(m, hata, tekrar) {
    var d = $('durum'); d.style.display = 'block'; d.className = hata ? 'hata' : ''; d.textContent = m;
    if (tekrar) { var b = el('button', 'mini ana', 'Tekrar dene'); b.type = 'button'; b.style.marginTop = '12px'; b.addEventListener('click', tekrar);
      d.appendChild(document.createElement('br')); d.appendChild(b); }
  }
  function listeyeDon() {
    izlemeBitir(); baloncukKapat(); acmaNo++; aktif = 0;
    devamCiz();
    goster('liste');
    window.scrollTo(0, 0);
  }
  $('btn-sureler').addEventListener('click', listeyeDon);
  $('btn-onceki').addEventListener('click', function () { if (aktif > 1) sureAc(aktif - 1); });
  $('btn-sonraki').addEventListener('click', function () { if (aktif < 114) sureAc(aktif + 1); });

  function kayitlariAl(liste) {
    kayitlar = {};
    (liste || []).forEach(function (k) { kayitlar[k.ayet] = { vurgu: k.vurgu || 0, not: k.not || '', tarih: k.tarih || '' }; });
  }
  function satir(no) { return $('ayetler').querySelector('.ayet[data-no="' + no + '"]'); }
  function notKutusu(no) { return $('ayetler').querySelector('.not-kutu[data-no="' + no + '"]'); }
  function ayetMetni(no) { for (var i = 0; i < ayetMetinleri.length; i++) if (ayetMetinleri[i][0] === no) return ayetMetinleri[i][1]; return ''; }

  function ayetleriCiz() {
    var kap = $('ayetler'); kap.textContent = '';
    var parca = document.createDocumentFragment();
    ayetMetinleri.forEach(function (a) {
      var p = el('div', 'ayet'); p.setAttribute('data-no', String(a[0]));
      p.appendChild(el('sup', 'no', String(a[0])));
      var sp = el('span', 'metin'); isaretliEkle(sp, a[1]); p.appendChild(sp);
      ayetiGuncelle(a[0], p);
      parca.appendChild(p);
    });
    kap.appendChild(parca);
  }
  function ayetiGuncelle(no, yeni) {
    var p = yeni || satir(no); if (!p) return;
    var k = kayitlar[no];
    p.classList.remove('v1', 'v2', 'v3');
    if (k && k.vurgu) p.classList.add('v' + k.vurgu);
    var ikon = p.querySelector('.not-ikon');
    if (k && k.not) {
      if (!ikon) {
        ikon = el('button', 'not-ikon'); ikon.type = 'button'; ikon.setAttribute('aria-label', 'Notunuzu göster');
        ikon.appendChild(svg('not'));
        ikon.addEventListener('click', function (e) {
          e.stopPropagation(); baloncukKapat();
          var kutu = notKutusu(no); if (kutu) kutu.parentNode.removeChild(kutu); else notKutusunuAc(no, 'goster');
        });
        p.appendChild(ikon);
      }
    } else if (ikon) ikon.parentNode.removeChild(ikon);
    if (yeni) return;
    var kutu = notKutusu(no);
    if (kutu && kutu.getAttribute('data-mod') === 'goster') { if (k && k.not) notKutusunuAc(no, 'goster'); else kutu.parentNode.removeChild(kutu); }
  }
  function tumunuGuncelle() { ayetMetinleri.forEach(function (a) { ayetiGuncelle(a[0]); }); }

  // ---------------------------------------------------------------- seçim + baloncuk
  var secili = {}, balonX = 0, balonY = 0, balonKaydirma = 0;
  function seciliSirali() { return Object.keys(secili).map(Number).sort(function (a, b) { return a - b; }); }
  function secimiBosalt() {
    secili = {};
    var l = $('ayetler').querySelectorAll('.ayet.sec'); for (var i = 0; i < l.length; i++) l[i].classList.remove('sec');
  }
  $('ayetler').addEventListener('click', function (e) {
    var p = e.target.closest ? e.target.closest('.ayet') : null;
    if (!p || e.target.closest('.not-ikon')) return;
    var no = parseInt(p.getAttribute('data-no'), 10);
    cokluNotuKapat();
    if (secili[no]) { delete secili[no]; p.classList.remove('sec'); if (!seciliSirali().length) { baloncukKapat(); return; } }
    else { secili[no] = true; p.classList.add('sec'); yerelYaz('son_ayet', no); }
    baloncukAc(e.clientX, e.clientY);
  });

  function baloncukAc(x, y) {
    if (x !== undefined) { balonX = x; balonY = y; }
    var nolar = seciliSirali();
    var b = $('baloncuk');
    if (!nolar.length) { baloncukKapat(); return; }
    var tek = nolar.length === 1 ? nolar[0] : 0;
    var k = tek ? (kayitlar[tek] || { vurgu: 0, not: '' }) : { vurgu: 0, not: '' };
    b.textContent = '';
    if (!tek) b.appendChild(el('span', 'bl-sayi', nolar.length + ' ayet'));
    var kopya = el('button', 'bl'); kopya.type = 'button'; kopya.setAttribute('aria-label', 'Kopyala'); kopya.appendChild(svg('kopya'));
    kopya.addEventListener('click', function (e) { e.stopPropagation(); kopyala(nolar); baloncukKapat(); });
    b.appendChild(kopya);
    b.appendChild(el('span', 'bl-ayrac'));
    function hepsi(kod) { for (var i = 0; i < nolar.length; i++) if (((kayitlar[nolar[i]] || {}).vurgu || 0) !== kod) return false; return true; }
    function herhangi() { for (var i = 0; i < nolar.length; i++) if ((kayitlar[nolar[i]] || {}).vurgu) return true; return false; }
    RENKLER.forEach(function (r) {
      var h = hepsi(r.kod);
      var d = el('button', 'bl r' + r.kod + (h ? ' secili' : '')); d.type = 'button'; d.setAttribute('aria-label', r.ad + ' vurgu');
      d.addEventListener('click', function (e) { e.stopPropagation(); vurguVer(nolar, h ? 0 : r.kod); if (tek) baloncukKapat(); else baloncukAc(); });
      b.appendChild(d);
    });
    if (herhangi()) {
      var t = el('button', 'bl'); t.type = 'button'; t.setAttribute('aria-label', 'Vurguyu kaldır'); t.appendChild(svg('kapat'));
      t.addEventListener('click', function (e) { e.stopPropagation(); vurguVer(nolar, 0); if (tek) baloncukKapat(); else baloncukAc(); });
      b.appendChild(t);
    }
    b.appendChild(el('span', 'bl-ayrac'));
    var n = el('button', 'bl'); n.type = 'button'; var notVar = !!(tek && k.not);
    n.setAttribute('aria-label', tek ? (notVar ? 'Notu göster' : 'Not al') : 'Seçili ayetlere not yaz');
    n.appendChild(svg('not'));
    n.addEventListener('click', function (e) {
      e.stopPropagation();
      if (tek) { baloncukKapat(); notKutusunuAc(tek, notVar ? 'goster' : 'duzenle'); return; }
      b.className = ''; cokluNotKutusunuAc(nolar);
    });
    b.appendChild(n);
    b.className = 'acik';
    balonKaydirma = window.pageYOffset || 0;
    var gen = b.offsetWidth, yuk = b.offsetHeight, vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var sol = Math.min(Math.max(8, balonX - gen / 2), vw - gen - 8);
    var ust = balonY - yuk - 14; if (ust < 8) ust = balonY + 18; if (ust + yuk > vh - 8) ust = Math.max(8, vh - yuk - 8);
    b.style.left = sol + 'px'; b.style.top = ust + 'px';
  }
  function baloncukKapat() { $('baloncuk').className = ''; secimiBosalt(); }
  document.addEventListener('click', function (e) {
    var b = $('baloncuk');
    if (b.className !== 'acik' || b.contains(e.target) || (e.target.closest && e.target.closest('.ayet'))) return;
    baloncukKapat();
  });
  window.addEventListener('scroll', function () {
    if ($('baloncuk').className === 'acik' && Math.abs((window.pageYOffset || 0) - balonKaydirma) > 40) baloncukKapat();
    $('yukari').className = (window.pageYOffset || 0) > 500 ? 'acik' : '';
  }, { passive: true });
  $('yukari').addEventListener('click', function () { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); } });

  // ---------------------------------------------------------------- kopyala
  function araliklar(n) {
    if (!n.length) return '';
    var p = [], bas = n[0], onc = n[0];
    for (var i = 1; i <= n.length; i++) { var x = n[i]; if (x === onc + 1) { onc = x; continue; } p.push(bas === onc ? String(bas) : bas + '-' + onc); bas = x; onc = x; }
    return p.join(', ');
  }
  function kopyala(nolar) {
    if (!aktif || !nolar.length) return;
    var govde = nolar.length === 1 ? ayetMetni(nolar[0]) : nolar.map(function (n) { return n + '. ' + ayetMetni(n); }).join('\n');
    var metin = "Kur'an-ı Kerim, " + SURELER[aktif - 1] + ' ' + aktif + ':' + araliklar(nolar) + ' (' + KAYNAK + ')\n' + govde;
    try { Android.copy(metin); bildir(nolar.length > 1 ? nolar.length + ' ayet kopyalandı' : 'Kopyalandı'); }
    catch (e) { bildir('Kopyalanamadı'); }
  }

  // ---------------------------------------------------------------- vurgu + not
  function vurguVer(nolar, renk) {
    if (!aktif || !nolar.length) return;
    var sure = aktif, benim = acmaNo;
    kayitDegisti = true;
    var onceki = JSON.parse(JSON.stringify(kayitlar));
    nolar.forEach(function (no) {
      var k = kayitlar[no] || { vurgu: 0, not: '', tarih: '' };
      k.vurgu = renk;
      if (!k.vurgu && !k.not) delete kayitlar[no]; else kayitlar[no] = k;
      ayetiGuncelle(no);
    });
    sirayaAl(function () {
      return sunucu({ action: 'mark', sure: sure, ayetler: nolar.join(','), renk: renk }).then(function (d) {
        if (benim !== acmaNo) return;
        if (!d || !d.ok) throw new Error('x');
        kayitlariAl(d.kayitlar); tumunuGuncelle();
      }).catch(function () {
        if (benim !== acmaNo) return;
        kayitlar = onceki; tumunuGuncelle(); bildir('Vurgu kaydedilemedi');
      });
    });
  }

  function notKutusunuAc(no, mod) {
    var p = satir(no); if (!p) return;
    var eski = notKutusu(no); if (eski) eski.parentNode.removeChild(eski);
    var k = kayitlar[no] || { vurgu: 0, not: '', tarih: '' };
    if (mod === 'goster' && !k.not) mod = 'duzenle';
    var kutu = el('div', 'not-kutu'); kutu.setAttribute('data-no', String(no)); kutu.setAttribute('data-mod', mod);
    kutu.addEventListener('click', function (e) { e.stopPropagation(); });
    if (mod === 'goster') {
      if (k.tarih) kutu.appendChild(el('div', 'not-tarih', k.tarih));
      kutu.appendChild(el('div', 'not-metin-goster', k.not));
      var dm = el('div', 'dugmeler');
      var d = el('button', 'mini', 'Düzenle'); d.type = 'button'; d.addEventListener('click', function () { notKutusunuAc(no, 'duzenle'); });
      var s = el('button', 'mini tehlike', 'Sil'); s.type = 'button';
      s.addEventListener('click', function () {
        dm.textContent = ''; dm.appendChild(el('span', null, 'Not silinsin mi?'));
        var ev = el('button', 'mini tehlike', 'Evet, sil'); ev.type = 'button'; ev.addEventListener('click', function () { notKaydet([no], '', null, null, true); });
        var ha = el('button', 'mini', 'Vazgeç'); ha.type = 'button'; ha.addEventListener('click', function () { notKutusunuAc(no, 'goster'); });
        dm.appendChild(ev); dm.appendChild(ha);
      });
      var kp = el('button', 'mini', 'Kapat'); kp.type = 'button'; kp.addEventListener('click', function () { if (kutu.parentNode) kutu.parentNode.removeChild(kutu); });
      dm.appendChild(d); dm.appendChild(s); dm.appendChild(kp);
      kutu.appendChild(dm);
    } else {
      var duzen = !!k.not;
      var ta = el('textarea', 'not-metin'); ta.maxLength = NOT_MAX; ta.placeholder = no + '. ayet için notunuzu yazın...'; ta.value = duzen ? k.not : '';
      var alt = el('div', 'dugmeler');
      var kaydet = el('button', 'mini ana', duzen ? 'Güncelle' : 'Kaydet'); kaydet.type = 'button';
      var vaz = el('button', 'mini', 'Vazgeç'); vaz.type = 'button';
      var say = el('span', 'sayac', ta.value.length + ' / ' + NOT_MAX);
      var durum = el('div', 'not-durum');
      ta.addEventListener('input', function () { say.textContent = ta.value.length + ' / ' + NOT_MAX; });
      vaz.addEventListener('click', function () { if (duzen) notKutusunuAc(no, 'goster'); else if (kutu.parentNode) kutu.parentNode.removeChild(kutu); });
      kaydet.addEventListener('click', function () { notKaydet([no], ta.value, kaydet, durum, false); });
      alt.appendChild(kaydet); alt.appendChild(vaz); alt.appendChild(say);
      kutu.appendChild(ta); kutu.appendChild(alt); kutu.appendChild(durum);
      setTimeout(function () { try { ta.focus(); } catch (e) {} }, 30);
    }
    p.parentNode.insertBefore(kutu, p.nextSibling);
  }

  function cokluNotuKapat() { var k = $('coklu-not'); if (k && k.parentNode) k.parentNode.removeChild(k); }
  function cokluNotKutusunuAc(nolar) {
    cokluNotuKapat();
    var son = satir(nolar[nolar.length - 1]); if (!son) return;
    var dolu = nolar.filter(function (n) { return (kayitlar[n] || {}).not; });
    var kutu = el('div', 'not-kutu'); kutu.id = 'coklu-not';
    kutu.addEventListener('click', function (e) { e.stopPropagation(); });
    kutu.appendChild(el('div', 'coklu-baslik', nolar.length + ' ayet için not: ' + araliklar(nolar)));
    if (dolu.length) kutu.appendChild(el('div', 'coklu-uyari', dolu.length + ' ayette zaten notunuz var; kaydedince onların yerine bu not yazılır (' + araliklar(dolu) + ').'));
    var ta = el('textarea', 'not-metin'); ta.maxLength = NOT_MAX; ta.placeholder = 'Seçili ayetlerin hepsine yazılacak notunuz...';
    var alt = el('div', 'dugmeler');
    var kaydet = el('button', 'mini ana', 'Kaydet'); kaydet.type = 'button';
    var vaz = el('button', 'mini', 'Vazgeç'); vaz.type = 'button';
    var say = el('span', 'sayac', '0 / ' + NOT_MAX);
    var durum = el('div', 'not-durum');
    ta.addEventListener('input', function () { say.textContent = ta.value.length + ' / ' + NOT_MAX; });
    vaz.addEventListener('click', function () { cokluNotuKapat(); secimiBosalt(); });
    kaydet.addEventListener('click', function () { notKaydet(nolar, ta.value, kaydet, durum, false, true); });
    alt.appendChild(kaydet); alt.appendChild(vaz); alt.appendChild(say);
    kutu.appendChild(ta); kutu.appendChild(alt); kutu.appendChild(durum);
    son.parentNode.insertBefore(kutu, son.nextSibling);
    setTimeout(function () { try { ta.focus(); } catch (e) {} }, 30);
  }

  function notKaydet(nolar, ham, dugme, durum, sil, coklu) {
    if (!aktif) return;
    var metin = String(ham || '').trim();
    if (!sil && !metin) { if (durum) { durum.className = 'not-durum hata'; durum.textContent = 'Önce notunuzu yazın.'; } return; }
    var sure = aktif, benim = acmaNo;
    kayitDegisti = true;
    if (dugme) dugme.disabled = true;
    if (durum) { durum.className = 'not-durum'; durum.textContent = 'Kaydediliyor...'; }
    sirayaAl(function () {
      return sunucu({ action: 'note', sure: sure, ayetler: nolar.join(','), not: sil ? '' : metin.substring(0, NOT_MAX) }).then(function (d) {
        if (benim !== acmaNo) return;
        if (!d || !d.ok) throw new Error('x');
        kayitlariAl(d.kayitlar);
        if (coklu) { cokluNotuKapat(); secimiBosalt(); }
        tumunuGuncelle();
        if (sil) { var k = notKutusu(nolar[0]); if (k && k.parentNode) k.parentNode.removeChild(k); bildir('Not silindi'); }
        else if (!coklu) { notKutusunuAc(nolar[0], 'goster'); bildir('Not kaydedildi'); }
        else bildir(nolar.length + ' ayete not kaydedildi');
      }).catch(function () {
        if (benim !== acmaNo) return;
        if (dugme) dugme.disabled = false;
        if (durum) { durum.className = 'not-durum hata'; durum.textContent = 'Kaydedilemedi (bağlantı). Notunuz kutuda duruyor, tekrar deneyin.'; }
        else bildir('İşlem yapılamadı (bağlantı)');
      });
    });
  }

  // ---------------------------------------------------------------- sure içinde arama
  var aramaTerimleri = null, eslesmeler = [], eslesmeNo = -1;
  function isaretliEkle(kap, metin) {
    metin = String(metin == null ? '' : metin);
    var t = aramaTerimleri;
    if (!t || !t.length) { kap.appendChild(document.createTextNode(metin)); return; }
    var f = katla(metin), ar = [], i, j;
    for (j = 0; j < t.length; j++) { i = f.indexOf(t[j]); while (i !== -1) { ar.push([i, i + t[j].length]); i = f.indexOf(t[j], i + t[j].length); } }
    if (!ar.length) { kap.appendChild(document.createTextNode(metin)); return; }
    ar.sort(function (x, y) { return x[0] - y[0]; });
    var bir = [ar[0]];
    for (i = 1; i < ar.length; i++) { var s = bir[bir.length - 1]; if (ar[i][0] > s[1]) bir.push(ar[i]); else if (ar[i][1] > s[1]) s[1] = ar[i][1]; }
    var konum = 0;
    bir.forEach(function (r) {
      if (r[0] > konum) kap.appendChild(document.createTextNode(metin.substring(konum, r[0])));
      kap.appendChild(el('mark', 'isaret', metin.substring(r[0], r[1]))); konum = r[1];
    });
    if (metin.length > konum) kap.appendChild(document.createTextNode(metin.substring(konum)));
  }
  function isaretleriYenile() {
    ayetMetinleri.forEach(function (a) { var s = satir(a[0]); var sp = s && s.querySelector('.metin'); if (!sp) return; sp.textContent = ''; isaretliEkle(sp, a[1]); });
  }
  function araSayac() {
    var kap = $('ara-sonuc');
    if (!aramaTerimleri || !aramaTerimleri.length) { kap.className = ''; return; }
    var n = eslesmeler.length;
    $('ara-sayi').textContent = n ? (n + ' ayette bulundu' + (eslesmeNo >= 0 ? ' (' + (eslesmeNo + 1) + '.)' : '')) : 'Bu surede bulunamadı';
    $('ara-onceki').style.display = n > 1 ? '' : 'none';
    $('ara-sonraki').style.display = n > 0 ? '' : 'none';
    kap.className = 'acik';
  }
  function eslesmeGoster(i) {
    var l = $('ayetler').querySelectorAll('.ayet.hedef'); for (var k = 0; k < l.length; k++) l[k].classList.remove('hedef');
    if (!eslesmeler.length) return;
    var n = eslesmeler.length; eslesmeNo = ((i % n) + n) % n;
    var s = satir(eslesmeler[eslesmeNo]); if (s) { s.classList.add('hedef'); s.scrollIntoView({ block: 'center' }); }
    araSayac();
  }
  function bolumAra() {
    var q = $('bolum-ara').value.trim();
    if (!q) { araTemizle(); return; }
    if (q.length < 2) { bildir('En az 2 harf yazın'); return; }
    aramaTerimleri = katla(q).split(/\s+/).filter(function (x) { return x.length > 0; }).slice(0, 6);
    eslesmeler = []; eslesmeNo = -1;
    ayetMetinleri.forEach(function (a) {
      var f = katla(a[1]);
      for (var i = 0; i < aramaTerimleri.length; i++) if (f.indexOf(aramaTerimleri[i]) === -1) return;
      eslesmeler.push(a[0]);
    });
    isaretleriYenile(); araSayac();
    if (eslesmeler.length) eslesmeGoster(0);
    $('bolum-ara').blur();
  }
  function araTemizle() {
    aramaTerimleri = null; eslesmeler = []; eslesmeNo = -1; $('bolum-ara').value = '';
    var l = $('ayetler').querySelectorAll('.ayet.hedef'); for (var k = 0; k < l.length; k++) l[k].classList.remove('hedef');
    isaretleriYenile(); araSayac();
  }
  $('bolum-ara-btn').addEventListener('click', bolumAra);
  $('bolum-ara').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); bolumAra(); } });
  $('ara-sonraki').addEventListener('click', function () { eslesmeGoster(eslesmeNo + 1); });
  $('ara-onceki').addEventListener('click', function () { eslesmeGoster(eslesmeNo < 0 ? -1 : eslesmeNo - 1); });
  $('ara-temizle').addEventListener('click', araTemizle);

  // ---------------------------------------------------------------- okuma süresi
  var iz = { sure: 0, bekleyen: 0, acik: false, sonEtkinlik: Date.now(), sonTik: Date.now(), gonderiliyor: false };
  function izlemeBaslat(s) { iz.sure = s; iz.bekleyen = 0; iz.acik = true; iz.sonEtkinlik = Date.now(); iz.sonTik = Date.now(); }
  function izlemeGonder(cikis) {
    if (!iz.sure) return;
    var sn = Math.floor(iz.bekleyen);
    if (sn < 1 || (iz.gonderiliyor && !cikis)) return;
    iz.bekleyen -= sn; iz.gonderiliyor = true;
    var sure = iz.sure;
    sunucu({ action: 'readTime', sure: sure, saniye: sn }).then(function (d) {
      iz.gonderiliyor = false; if (!d || !d.ok) throw new Error('x');
    }).catch(function () { iz.gonderiliyor = false; if (iz.sure === sure) iz.bekleyen = Math.min(iz.bekleyen + sn, 3600); });
  }
  function izlemeBitir() { izlemeGonder(true); iz.acik = false; iz.sure = 0; iz.bekleyen = 0; }
  ['touchstart', 'touchmove', 'scroll', 'click', 'keydown'].forEach(function (o) {
    document.addEventListener(o, function () { iz.sonEtkinlik = Date.now(); }, { passive: true, capture: true });
  });
  var gorunur = true;
  setInterval(function () {
    var simdi = Date.now(), fark = (simdi - iz.sonTik) / 1000; iz.sonTik = simdi;
    if (!iz.acik || !gorunur || document.hidden) return;
    if ((simdi - iz.sonEtkinlik) / 1000 > BOSTA_SN) return;
    iz.bekleyen += Math.min(fark, 2);
    if (iz.bekleyen >= GONDER_SN) izlemeGonder(false);
  }, 1000);

  // ---------------------------------------------------------------- uygulamadan çağrılanlar
  /** Geri tuşu: kutu/baloncuk/okuyucu kapatılabildiyse 'true'. */
  window.kitapGeri = function () {
    if ($('baloncuk').className === 'acik') { baloncukKapat(); return 'true'; }
    if ($('coklu-not')) { cokluNotuKapat(); secimiBosalt(); return 'true'; }
    if ($('g-okuyucu').style.display === 'block') { listeyeDon(); return 'true'; }
    return 'false';
  };
  window.kitapGorunur = function (v) {
    gorunur = !!v;
    if (!gorunur) izlemeGonder(true); else { iz.sonEtkinlik = Date.now(); iz.sonTik = Date.now(); }
  };
  window.kitapTema = function (koyu) { document.documentElement.classList.toggle('dark', !!koyu); };
  document.addEventListener('visibilitychange', function () { if (document.hidden) izlemeGonder(true); });

  listeyiCiz();
  goster('liste');
})();
</script>
