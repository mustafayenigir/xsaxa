<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>Meyvem</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="top"><button class="link" id="settings">⚙ Ayarlar</button></div>
  <div class="wrap">
    <form class="box" id="form" autocomplete="off">
      <p class="brand">🍓 Meyvem</p>
      <h1 id="title">Şifreyi Gir</h1>
      <p class="info" id="info"></p>
      <div class="row" id="noRow" hidden>
        <input type="text" id="no" placeholder="Giriş numarası (00xxxxxx-xxxxx)" maxlength="40" autocapitalize="characters" spellcheck="false">
      </div>
      <input type="password" id="pwd" placeholder="Şifre" autofocus>
      <div class="row" id="confirmRow" hidden>
        <input type="password" id="pwd2" placeholder="Şifre (tekrar)">
      </div>
      <button class="primary" id="go" type="submit">Giriş Yap</button>
      <div class="msg" id="msg"></div>
      <p class="hint" id="hint"></p>
    </form>
  </div>
  <script src="palette.js"></script>
  <script src="lock.js"></script>
</body>
</html>
