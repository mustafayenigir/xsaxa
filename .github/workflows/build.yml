name: APK Derle

on:
  push:
    branches: [ main, master ]
    # Sadece Windows (desktop/) değişince Android APK yeniden derlenmesin
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradlew calistirilabilir yap
        run: chmod +x ./gradlew

      - name: APK derle (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK adini duzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Meyvem.apk

      - name: APK yukle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: meyvem-apk
          path: Meyvem.apk
          if-no-files-found: error

      # Telefondan tek dokunusla indirilebilen sabit baglanti:
      # https://github.com/<kullanici>/<depo>/releases/latest/download/Meyvem.apk
      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Meyvem.apk \
            --title "Meyvem (son surum)" \
            --notes "Otomatik derleme: ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
