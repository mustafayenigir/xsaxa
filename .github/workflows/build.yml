name: APK Derle

on:
  push:
    branches: [ main, master ]
    # Sadece Windows (desktop/) değişince Android APK yeniden derlenmesin
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'kilif/**'
      - 'meyvem-v2/**'
      - 'oku/**'
      - '.github/workflows/oku-android.yml'
      - 'kitap/**'
      - '.github/workflows/kitap-android.yml'
      - '.github/workflows/kilif-*.yml'
      - '.github/workflows/v2-*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: gradlew calistirilabilir yap
        run: chmod +x ./gradlew

      - name: APK derle (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK adini duzenle
        run: cp app/build/outputs/apk/debug/app-debug.apk Meyvem.apk

      - name: APK yukle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: meyvem-apk
          path: Meyvem.apk
          if-no-files-found: error

      # Sabit indirme baglantisi: https://github.com/<kullanici>/<depo>/releases/download/latest/Meyvem.apk
      # Surum silinip yeniden olusturulmaz; dosya yerinde degistirilir (taslakta kalma / 404 riski olmasin).
      - name: Release olarak yayinla
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Meyvem.apk --clobber
          else
            gh release create latest Meyvem.apk --title "Meyvem (son surum)" --notes "Otomatik derleme" --target "${GITHUB_SHA}"
          fi
          gh release edit latest --draft=false --notes "Otomatik derleme: ${GITHUB_SHA}"
          # Baglanti gercekten calisiyor mu? (en cok ~1 dk dene)
          for i in 1 2 3 4 5 6; do
            if curl -sfL -r 0-0 -o /dev/null "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Meyvem.apk"; then echo "Baglanti hazir"; exit 0; fi
            sleep 10
          done
          echo "Indirme baglantisi calismiyor"; exit 1
